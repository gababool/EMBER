    <linearGradient id="innerFlame" x1="514" y1="610" x2="514" y2="948" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFCE8"/>
      <stop offset="0.38" stop-color="#FFF6A6"/>
      <stop offset="0.75" stop-color="#FFE35A"/>
