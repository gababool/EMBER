<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Icon-style fire logo</title>
  <desc id="desc">A clean layered vector flame logo with corrected, narrower proportions and red, orange, and yellow gradients.</desc>

  <defs>
    <linearGradient id="outerFlame" x1="512" y1="76" x2="512" y2="948" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFB000"/>
      <stop offset="0.43" stop-color="#FF6A00"/>
      <stop offset="0.78" stop-color="#FF2D00"/>
      <stop offset="1" stop-color="#ED0014"/>
    </linearGradient>

    <linearGradient id="middleFlame" x1="517" y1="382" x2="517" y2="946" gradientUnits="userSpaceOnUse">
